name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

  build-binary:
    name: Build cross-platform binaries
    # Runs on macOS so the darwin-arm64 target is ad-hoc codesigned by tsdown
    # (Gatekeeper). linux-arm64/linux-x64 are built cross-platform in the
    # same `tsdown` invocation; LIEF injection is host-agnostic.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SEA binaries
        run: pnpm --filter @aliou/sesame-cli run build:binary

      - name: Verify binaries were produced
        run: |
          set -e
          for artifact in sesame-darwin-arm64 sesame-linux-arm64 sesame-linux-x64; do
            if [ ! -f "packages/cli/dist/$artifact" ]; then
              echo "ERROR: $artifact was not produced. tsdown may have silently failed."
              ls -la packages/cli/dist/
              exit 1
            fi
          done

      - name: Smoke test (darwin-arm64)
        run: packages/cli/dist/sesame-darwin-arm64 help

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sesame-binaries
          path: |
            packages/cli/dist/sesame-darwin-arm64
            packages/cli/dist/sesame-linux-arm64
            packages/cli/dist/sesame-linux-x64
